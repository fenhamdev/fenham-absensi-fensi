name: fensi_app
description: "FENSI (Fenham Absensi) - Multi-Platform Employee Attendance & HC Web Admin System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Supabase & Backend
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Location & Camera
  geolocator: ^11.0.0
  camera: ^0.10.5+9
  image_picker: ^1.1.0

  # Admin Dashboard & Analytics Charts
  fl_chart: ^0.68.0

  # Export Reports (PDF & Excel)
  excel: ^4.0.3
  pdf: ^3.10.8
  printing: ^5.13.0

  # UI Utilities & Helpers
  google_fonts: ^6.2.1
  intl: ^0.19.0
  table_calendar: ^3.1.1
  file_picker: ^8.0.3
  cupertino_icons: ^1.0.6

  # Session Persistence
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
